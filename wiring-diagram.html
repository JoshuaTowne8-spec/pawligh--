<div id="pet-wiring-diagram">
  <style>
    #pet-wiring-diagram { width: 100%; color: var(--foreground); }
    #pet-wiring-diagram svg { display: block; width: 100%; height: auto; }
    #pet-wiring-diagram .unit { fill: color-mix(in srgb, var(--card) 92%, transparent); stroke: var(--border); stroke-width: 2; }
    #pet-wiring-diagram .pin { fill: color-mix(in srgb, var(--muted) 65%, transparent); stroke: var(--border); stroke-width: 1; }
    #pet-wiring-diagram .label { fill: var(--foreground); font-size: 18px; font-weight: 500; }
    #pet-wiring-diagram .small { fill: var(--muted-foreground); font-size: 15px; font-weight: 400; }
    #pet-wiring-diagram .wire { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    #pet-wiring-diagram .power5 { stroke: var(--red); }
    #pet-wiring-diagram .power3 { stroke: var(--orange); }
    #pet-wiring-diagram .ground { stroke: var(--foreground); }
    #pet-wiring-diagram .i2s { stroke: var(--viz-series-1); }
    #pet-wiring-diagram .i2c { stroke: var(--viz-series-2); }
    #pet-wiring-diagram .leddata { stroke: var(--viz-series-3); }
    #pet-wiring-diagram .touch { stroke: var(--purple); stroke-width: 2; }
    #pet-wiring-diagram .optional { stroke-dasharray: 7 5; }
    #pet-wiring-diagram .junction { fill: var(--foreground); }
    #pet-wiring-diagram .led { fill: color-mix(in srgb, var(--yellow) 35%, transparent); stroke: var(--border); }
    #pet-wiring-diagram .foil { fill: color-mix(in srgb, var(--purple) 24%, transparent); stroke: var(--purple); }
    #pet-wiring-diagram .mobile-diagram { display: none; }
    @media (max-width: 520px) {
      #pet-wiring-diagram .desktop-diagram { display: none; }
      #pet-wiring-diagram .mobile-diagram { display: block; }
    }
  </style>
  <svg class="desktop-diagram" viewBox="0 0 1000 760" role="img" aria-labelledby="wiring-title wiring-desc">
    <title id="wiring-title">ESP32-S3、INMP441、MPR121与双WS2812物理接线图</title>
    <desc id="wiring-desc">ESP32-S3使用GPIO16到18连接I2S麦克风，GPIO8到10连接MPR121，GPIO4和5连接两条灯带；灯带由外部5伏电源供电，所有模块共地。</desc>

    <text x="500" y="28" text-anchor="middle" class="label">ESP32-S3 宠物情绪灯系统接线</text>

    <rect x="400" y="72" width="200" height="330" rx="18" class="unit"/>
    <text x="500" y="101" text-anchor="middle" class="label">ESP32-S3 N16R8</text>
    <text x="500" y="121" text-anchor="middle" class="small">USB-C（COM）烧录与原型供电</text>

    <g class="small">
      <rect x="412" y="143" width="76" height="24" rx="5" class="pin"/><text x="450" y="159" text-anchor="middle">3V3</text>
      <rect x="512" y="143" width="76" height="24" rx="5" class="pin"/><text x="550" y="159" text-anchor="middle">GND</text>
      <rect x="412" y="181" width="76" height="24" rx="5" class="pin"/><text x="450" y="197" text-anchor="middle">GPIO16 SD</text>
      <rect x="412" y="215" width="76" height="24" rx="5" class="pin"/><text x="450" y="231" text-anchor="middle">GPIO17 SCK</text>
      <rect x="412" y="249" width="76" height="24" rx="5" class="pin"/><text x="450" y="265" text-anchor="middle">GPIO18 WS</text>
      <rect x="512" y="181" width="76" height="24" rx="5" class="pin"/><text x="550" y="197" text-anchor="middle">GPIO8 SDA</text>
      <rect x="512" y="215" width="76" height="24" rx="5" class="pin"/><text x="550" y="231" text-anchor="middle">GPIO9 SCL</text>
      <rect x="512" y="249" width="76" height="24" rx="5" class="pin"/><text x="550" y="265" text-anchor="middle">GPIO10 IRQ</text>
      <rect x="412" y="305" width="76" height="24" rx="5" class="pin"/><text x="450" y="321" text-anchor="middle">GPIO4 LED-A</text>
      <rect x="512" y="305" width="76" height="24" rx="5" class="pin"/><text x="550" y="321" text-anchor="middle">GPIO5 LED-B</text>
      <text x="500" y="365" text-anchor="middle">避免 GPIO0/3/19/20/33–37/45/46/48</text>
    </g>

    <rect x="40" y="120" width="230" height="220" rx="16" class="unit"/>
    <text x="155" y="151" text-anchor="middle" class="label">INMP441 数字麦克风</text>
    <text x="64" y="183" class="small">VDD → 3V3</text>
    <text x="64" y="210" class="small">GND → GND</text>
    <text x="64" y="237" class="small">SD → GPIO16</text>
    <text x="64" y="264" class="small">SCK → GPIO17</text>
    <text x="64" y="291" class="small">WS → GPIO18</text>
    <text x="64" y="318" class="small">L/R → GND（左声道）</text>

    <path d="M270 178 H330 V155 H412" class="wire power3"/>
    <path d="M270 205 H345 V155 H512" class="wire ground"/>
    <path d="M270 232 H412" class="wire i2s"/>
    <path d="M270 259 H350 V227 H412" class="wire i2s"/>
    <path d="M270 286 H365 V261 H412" class="wire i2s"/>
    <path d="M270 313 H345 V155 H512" class="wire ground"/>

    <rect x="730" y="82" width="230" height="250" rx="16" class="unit"/>
    <text x="845" y="113" text-anchor="middle" class="label">MPR121 电容触摸</text>
    <text x="754" y="145" class="small">VCC → 3V3</text>
    <text x="754" y="172" class="small">GND → GND</text>
    <text x="754" y="199" class="small">SDA → GPIO8</text>
    <text x="754" y="226" class="small">SCL → GPIO9</text>
    <text x="754" y="253" class="small">IRQ → GPIO10</text>
    <text x="754" y="280" class="small">ADDR → GND（地址0x5A）</text>
    <text x="754" y="307" class="small">ELE0–ELE8 → 九片铜箔</text>

    <path d="M730 140 H680 V155 H588" class="wire power3"/>
    <path d="M730 167 H665 V155 H588" class="wire ground"/>
    <path d="M730 194 H588" class="wire i2c"/>
    <path d="M730 221 H650 V227 H588" class="wire i2c"/>
    <path d="M730 248 H635 V261 H588" class="wire i2c"/>
    <path d="M730 275 H665 V155 H588" class="wire ground"/>

    <g>
      <text x="845" y="366" text-anchor="middle" class="label">九个铜箔触摸区</text>
      <rect x="744" y="382" width="54" height="36" rx="9" class="foil"/><text x="771" y="405" text-anchor="middle" class="small">E0</text>
      <rect x="818" y="382" width="54" height="36" rx="9" class="foil"/><text x="845" y="405" text-anchor="middle" class="small">E1</text>
      <rect x="892" y="382" width="54" height="36" rx="9" class="foil"/><text x="919" y="405" text-anchor="middle" class="small">E2</text>
      <rect x="744" y="430" width="54" height="36" rx="9" class="foil"/><text x="771" y="453" text-anchor="middle" class="small">E3</text>
      <rect x="818" y="430" width="54" height="36" rx="9" class="foil"/><text x="845" y="453" text-anchor="middle" class="small">E4</text>
      <rect x="892" y="430" width="54" height="36" rx="9" class="foil"/><text x="919" y="453" text-anchor="middle" class="small">E5</text>
      <rect x="744" y="478" width="54" height="36" rx="9" class="foil"/><text x="771" y="501" text-anchor="middle" class="small">E6</text>
      <rect x="818" y="478" width="54" height="36" rx="9" class="foil"/><text x="845" y="501" text-anchor="middle" class="small">E7</text>
      <rect x="892" y="478" width="54" height="36" rx="9" class="foil"/><text x="919" y="501" text-anchor="middle" class="small">E8</text>
      <path d="M845 332 V365" class="wire touch"/>
    </g>

    <rect x="40" y="430" width="230" height="120" rx="16" class="unit"/>
    <text x="155" y="462" text-anchor="middle" class="label">外部稳压电源</text>
    <text x="155" y="491" text-anchor="middle" class="small">5V / 3A（20颗灯建议）</text>
    <text x="155" y="520" text-anchor="middle" class="small">5V+　　GND</text>

    <rect x="330" y="466" width="300" height="88" rx="15" class="unit"/>
    <text x="480" y="493" text-anchor="middle" class="label">灯带输入保护</text>
    <text x="480" y="519" text-anchor="middle" class="small">每路DIN串330Ω；5V/GND并联470–1000µF电容</text>
    <text x="480" y="540" text-anchor="middle" class="small">最终产品建议加入74AHCT125电平转换</text>

    <rect x="270" y="610" width="300" height="92" rx="16" class="unit"/>
    <text x="420" y="640" text-anchor="middle" class="label">WS2812 灯带 A</text>
    <g>
      <circle cx="310" cy="670" r="12" class="led"/><circle cx="350" cy="670" r="12" class="led"/>
      <circle cx="390" cy="670" r="12" class="led"/><circle cx="430" cy="670" r="12" class="led"/>
      <circle cx="470" cy="670" r="12" class="led"/><circle cx="510" cy="670" r="12" class="led"/>
    </g>
    <text x="420" y="692" text-anchor="middle" class="small">DIN ← GPIO4；红线5V；黑线GND</text>

    <rect x="650" y="610" width="300" height="92" rx="16" class="unit"/>
    <text x="800" y="640" text-anchor="middle" class="label">WS2812 灯带 B</text>
    <g>
      <circle cx="690" cy="670" r="12" class="led"/><circle cx="730" cy="670" r="12" class="led"/>
      <circle cx="770" cy="670" r="12" class="led"/><circle cx="810" cy="670" r="12" class="led"/>
      <circle cx="850" cy="670" r="12" class="led"/><circle cx="890" cy="670" r="12" class="led"/>
    </g>
    <text x="800" y="692" text-anchor="middle" class="small">DIN ← GPIO5；红线5V；黑线GND</text>

    <path d="M450 329 V425 H420 V610" class="wire leddata"/>
    <path d="M550 329 V445 H800 V610" class="wire leddata"/>
    <text x="370" y="422" class="small">330Ω</text><text x="732" y="442" class="small">330Ω</text>

    <path d="M110 520 V578 H370 V610" class="wire power5"/>
    <path d="M110 520 V578 H750 V610" class="wire power5"/>
    <path d="M200 520 V590 H470 V610" class="wire ground"/>
    <path d="M200 520 V590 H850 V610" class="wire ground"/>
    <path d="M200 520 V390 H550 V167" class="wire ground"/>
    <circle cx="200" cy="520" r="5" class="junction"/>
    <circle cx="200" cy="590" r="5" class="junction"/>

    <text x="500" y="735" text-anchor="middle" class="small">若图五两排已在远端DOUT→DIN级联：只接GPIO4，把两排当作一条连续灯带；不要再接GPIO5。</text>
  </svg>
  <svg class="mobile-diagram" viewBox="0 0 360 1180" role="img" aria-labelledby="mobile-wiring-title mobile-wiring-desc">
    <title id="mobile-wiring-title">ESP32-S3移动版物理接线图</title>
    <desc id="mobile-wiring-desc">从上至下显示麦克风、触摸模块、ESP32、灯带保护、外部电源与双灯带的连接。</desc>
    <text x="180" y="27" text-anchor="middle" class="label">ESP32-S3 物理接线</text>

    <rect x="20" y="48" width="320" height="150" rx="14" class="unit"/>
    <text x="180" y="76" text-anchor="middle" class="label">INMP441 → ESP32-S3</text>
    <text x="42" y="104" class="small">VDD→3V3　GND、L/R→GND</text>
    <text x="42" y="131" class="small">SD→GPIO16　SCK→GPIO17</text>
    <text x="42" y="158" class="small">WS→GPIO18</text>
    <path d="M42 178 H318" class="wire i2s"/>

    <rect x="20" y="225" width="320" height="177" rx="14" class="unit"/>
    <text x="180" y="253" text-anchor="middle" class="label">MPR121 → ESP32-S3</text>
    <text x="42" y="281" class="small">VCC→3V3　GND、ADDR→GND</text>
    <text x="42" y="308" class="small">SDA→GPIO8　SCL→GPIO9</text>
    <text x="42" y="335" class="small">IRQ→GPIO10</text>
    <text x="42" y="362" class="small">ELE0–ELE8→九片铜箔</text>
    <path d="M42 382 H318" class="wire i2c"/>

    <path d="M180 198 V225" class="wire ground"/>
    <rect x="20" y="430" width="320" height="180" rx="14" class="unit"/>
    <text x="180" y="460" text-anchor="middle" class="label">ESP32-S3 N16R8</text>
    <text x="42" y="491" class="small">麦克风：GPIO16 / 17 / 18</text>
    <text x="42" y="519" class="small">触摸：GPIO8 / 9 / 10</text>
    <text x="42" y="547" class="small">灯带A：GPIO4　灯带B：GPIO5</text>
    <text x="42" y="575" class="small">USB-C（COM）烧录和原型供电</text>
    <path d="M42 592 H318" class="wire power3"/>

    <rect x="20" y="640" width="320" height="125" rx="14" class="unit"/>
    <text x="180" y="670" text-anchor="middle" class="label">灯带数据保护</text>
    <text x="42" y="701" class="small">GPIO4/5各串联330Ω到DIN</text>
    <text x="42" y="729" class="small">成品建议增加74AHCT125</text>
    <path d="M180 610 V640" class="wire leddata"/>

    <rect x="20" y="795" width="320" height="100" rx="14" class="unit"/>
    <text x="180" y="824" text-anchor="middle" class="label">外部5V / 3A电源</text>
    <text x="42" y="855" class="small">5V→两灯带红线；GND全部共地</text>
    <text x="42" y="880" class="small">灯带入口并联470–1000µF电容</text>

    <rect x="20" y="925" width="150" height="110" rx="14" class="unit"/>
    <text x="95" y="954" text-anchor="middle" class="label">灯带A</text>
    <text x="42" y="985" class="small">DIN←GPIO4</text>
    <text x="42" y="1013" class="small">红5V / 黑GND</text>
    <rect x="190" y="925" width="150" height="110" rx="14" class="unit"/>
    <text x="265" y="954" text-anchor="middle" class="label">灯带B</text>
    <text x="212" y="985" class="small">DIN←GPIO5</text>
    <text x="212" y="1013" class="small">红5V / 黑GND</text>
    <path d="M110 765 V925" class="wire leddata"/>
    <path d="M250 765 V925" class="wire leddata"/>
    <path d="M80 895 V925" class="wire power5"/>
    <path d="M280 895 V925" class="wire power5"/>

    <text x="180" y="1075" text-anchor="middle" class="small">若两排已经DOUT→DIN级联：</text>
    <text x="180" y="1103" text-anchor="middle" class="small">只使用GPIO4，总灯珠连续编号。</text>
    <text x="180" y="1146" text-anchor="middle" class="small">所有GND必须相连；INMP441与MPR121只接3.3V。</text>
  </svg>
</div>
